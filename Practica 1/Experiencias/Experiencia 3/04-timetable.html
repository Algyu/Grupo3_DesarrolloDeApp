<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>School timetable</title>
  <link href="minimal-table.css" rel="stylesheet" type="text/css">

  <style>
    col:nth-child(3) {
      background-color: #97DB9A;
    }

    col:nth-child(4) {
      width: 42px;
    }

    col:nth-child(5) {
      background-color: #97DB9A;
    }

    col:nth-child(6) {
      background-color: #DCC48E;
      border: 4px solid #C1437A;
    }

    col:nth-child(7),
    col:nth-child(8) {
      width: 42px;
    }
  </style>
</head>

<body>

  <h1>School timetable</h1>

  <table>

    <colgroup>
      <col>
      <col>
      <col>
      <col>
      <col>
      <col>
      <col>
      <col>
    </colgroup>

    <tr>
      <th></th>
      <th>Mon</th>
      <th>Tues</th>
      <th>Wed</th>
      <th>Thurs</th>
      <th>Fri</th>
      <th>Sat</th>
      <th>Sun</th>
    </tr>

    <tr>
      <th>1st period</th>
      <td>English</td>
      <td></td>
      <td></td>
      <td>German</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

    <tr>
      <th>2nd period</th>
      <td>English</td>
      <td>English</td>
      <td></td>
      <td>German</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

    <tr>
      <th>3rd period</th>
      <td></td>
      <td>German</td>
      <td></td>
      <td>German</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

    <tr>
      <th>4th period</th>
      <td></td>
      <td>English</td>
      <td></td>
      <td>English</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

  </table>

</body>
</html>
