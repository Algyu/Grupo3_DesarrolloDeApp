<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Colgroup y Col</title>
  <link href="minimal-table.css" rel="stylesheet" type="text/css">
</head>

<body>

  <h1>Colgroup y Col</h1>

  <table>

    <colgroup>
      <col>
      <col style="background-color: yellow">
    </colgroup>

    <tr>
      <th>Dato 1</th>
      <th>Dato 2</th>
    </tr>

    <tr>
      <td>Calcuta</td>
      <td>Pizza</td>
    </tr>

    <tr>
      <td>Robots</td>
      <td>Jazz</td>
    </tr>

  </table>

</body>
</html>
